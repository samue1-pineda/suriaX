name: Docs

on:
  push:
    branches: [main]
    paths:
      - "documentation/**"
      - "docs/**"
      - "*.md"
      # conf.py PUBLICA estos archivos, que viven junto al código que
      # documentan (REPO_DOCS). Sin nombrarlos aquí, editarlos no reconstruía
      # el sitio y la página quedaba mostrando la versión vieja sin que nada
      # avisara — con 'test_docs_al_dia' comprobando, encima, que el texto del
      # repositorio SÍ estaba al día. Un test de la suite exige que esta lista
      # cubra todo REPO_DOCS.
      - "lib/HOOKS.md"
      - "web/README.md"
      - "htims/readme.md"
      - "V0/src/HIR/PROTOBUF_BRIDGE.md"
      - "runtime/interpreter/ARQUITECTURA.md"
      # el título del sitio lleva la versión, que sale de aquí
      - "version.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "documentation/**"
      - "docs/**"
      - "*.md"
      # los mismos REPO_DOCS de arriba
      - "lib/HOOKS.md"
      - "web/README.md"
      - "htims/readme.md"
      - "V0/src/HIR/PROTOBUF_BRIDGE.md"
      - "runtime/interpreter/ARQUITECTURA.md"
      - "version.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construir el sitio (Sphinx)
    runs-on: ubuntu-latest
    # Una construcción tarda segundos: si pasa de esto, algo se colgó y es
    # mejor fallar que dejar el job esperando.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: documentation/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r documentation/requirements.txt

      # No se comprueban enlaces aquí a propósito: la documentación enlaza al
      # código en github.com, y las peticiones desde un runner chocan con el
      # límite de tasa. El comprobador se queda dormido esperando y el job se
      # CANCELA — y una cancelación no la cubre 'continue-on-error'. Para
      # revisarlos a mano: sphinx-build -b linkcheck documentation/source /tmp/lc
      - name: Build
        run: |
          sphinx-build -b html -W --keep-going \
            documentation/source documentation/build/html

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: documentation/build/html

  deploy:
    name: Publicar en GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
