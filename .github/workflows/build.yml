name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Smoke test
        run: |
          cat > /tmp/smoke.srcx <<'EOF'
          #test lexer
          int x = 1;
          EOF
          python V0/main.py /tmp/smoke.srcx

      - name: Run basic tests
        run: |
          python test/main.py 

      - name: Package preview release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          tar -czf dist/suriax-preview-linux.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            .

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: suriax-preview-linux
          path: dist/suriax-preview-linux.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: suriax-preview-linux
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/suriax-preview-linux.tar.gz
          draft: false
          prerelease: true