name: CI

# ¿Por qué existe este workflow si ya hay uno que corre las pruebas?
#
# Porque responde una pregunta que la suite NO puede responder: la suite corre
# en la máquina de quien la escribió, con sus dependencias ya instaladas, su
# versión de Python y sus artefactos ya generados. Este workflow comprueba lo
# que solo se rompe en una máquina limpia — y son promesas concretas que el
# proyecto hace por escrito:
#
#   1. "El compilador corre solo con la stdlib de Python": frontend, HIR e
#      intérprete (README, how_to_run.md, ARCHITECTURE.md). Es fácil romperla
#      sin notarlo: basta un 'import yaml' en el sitio equivocado, y en local
#      funciona porque yaml está instalado.
#   2. "Lo que sí exige una dependencia lo dice": hoy solo '--init-config'
#      (pyyaml). Tiene que salir con el código 3 y un mensaje, no con un
#      traceback.
#   3. "El .phir es reproducible." Localmente eso se prueba entre CORRIDAS;
#      aquí se prueba entre MÁQUINAS y versiones de Python, que es la promesa
#      de verdad (una caché de build por hash depende de ella).
#   4. "Python 3.10+". Se afirma en la documentación y solo se desarrolla en
#      una versión.
#
# Ninguna de las cuatro la puede contestar 'tests.yml', y las cuatro rompen
# silenciosamente.
#
# El programa que se compila va ESCRITO AQUÍ (env PROGRAMA) y cada job lo
# vuelca a disco. No depende de ningún archivo de prueba del repositorio: un
# ejercicio local (como fue 'b.srcx', que estaba en .gitignore) no puede ser
# dependencia de la CI — en un checkout limpio no existe.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Estructuras de datos de punta a punta: struct con métodos (@impl) y un
  # hook, enum + match, try/catch, while y el vector GENÉRICO de la stdlib
  # (#import de un paquete y de un submódulo). Devuelve 0: la salida se
  # comprueba aparte, y un exit distinto de 0 haría fallar el paso.
  PROGRAMA: |
    #from io #import stdp
    #import array.vector as vec

    struct {
        str nombre;
        int saldo;
    } Cuenta;

    enum Estado { ACTIVA, VACIA };

    @impl Cuenta {
        fn deposita(Cuenta ptr mutable self, int cuanto) -> void {
            if (cuanto <= 0) { throw "un deposito es positivo"; };
            self.saldo = self.saldo + cuanto;
        }
        fn estado(Cuenta ptr self) -> Estado {
            if (self.saldo == 0) { return Estado.VACIA; };
            return Estado.ACTIVA;
        }
    }

    hook fn __print__(Cuenta ptr c) -> void { stdp.println(f"{c.nombre}: {c.saldo}"); }

    fn describe(Estado e) -> str {
        match (e) {
            case Estado.ACTIVA: { return "activa"; }
            case Estado.VACIA: { return "vacia"; }
        }
        return "?";
    }

    fn main() -> int {
        var Cuenta a = Cuenta{ nombre: "ahorro", saldo: 0 };
        stdp.println(describe(a.estado()));
        a.deposita(40);
        print(a);
        try { a.deposita(0); } catch (str e) { stdp.println(f"error: {e}"); };

        var vec.Vector<int> v = vec.make<int>(4);
        var int i = 1;
        while (i <= 3) {
            v.push(i * 10);
            i = i + 1;
        };
        var int total = v.get(0) + v.get(1) + v.get(2);
        stdp.println(f"total = {total}, len = {v.len()}");
        return 0;
    };
  # Lo que el programa tiene que imprimir: si cambia, cambió el lenguaje.
  SALIDA_ESPERADA: "total = 60, len = 3"

jobs:
  sin-dependencias:
    name: El compilador corre sin dependencias externas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Escribir el programa
        run: printf '%s' "$PROGRAMA" > ci_programa.srcx

      # A PROPÓSITO no se instala nada: ni protobuf, ni pyyaml, ni protoc.
      # Ese es el experimento.
      - name: Compilar y ejecutar sin instalar nada
        run: |
          salida=$(python V0/main.py ci_programa.srcx --run)
          echo "$salida"
          echo "$salida" | grep -qF "$SALIDA_ESPERADA" || {
            echo "el programa no imprimió '$SALIDA_ESPERADA'"; exit 1; }

      - name: Ningún módulo del compilador importa una dependencia externa
        run: |
          python - <<'PY'
          import contextlib
          import io
          import os
          import sys

          # Se bloquean ANTES de importar el compilador: si algún módulo las
          # importa al cargarse, esto revienta con un mensaje que dice cuál.
          #
          # 'find_spec', no 'find_module': el segundo se eliminó del sistema de
          # importación en Python 3.12 y ya no lo llama nadie, así que un
          # bloqueo escrito con él no bloquea NADA y el job pasa en vacío —
          # exactamente el fallo silencioso que este workflow existe para
          # cazar. Se comprueba primero que el bloqueo funciona.
          class Bloqueo:
              def find_spec(self, name, path=None, target=None):
                  if name.split(".")[0] in ("google", "yaml", "protobuf"):
                      raise ImportError(
                          f"el compilador importó '{name}': tiene que funcionar "
                          "solo con la stdlib (ver how_to_run.md)")
                  return None

          sys.meta_path.insert(0, Bloqueo())

          # El bloqueo se prueba a sí mismo: si esto NO levanta, el resto de
          # la comprobación no demuestra nada.
          try:
              import yaml  # noqa: F401
          except ImportError:
              pass
          else:
              raise SystemExit("el bloqueo de dependencias no funciona: "
                               "esta comprobación no estaría probando nada")

          sys.path[:0] = [".", "V0"]
          from driver import CompileOptions, compile_source, execute

          # El pipeline ENTERO en proceso, con el bloqueo puesto: frontend,
          # HIR (codec propio, sin protobuf) e intérprete.
          resultado = compile_source("ci_programa.srcx", CompileOptions(run=True))
          assert resultado.ok, [f"{d.code}: {d.message}" for d in resultado.diagnostics]
          assert resultado.phir_path, "no se emitió el .phir"
          salida = io.StringIO()
          with contextlib.redirect_stdout(salida):
              codigo = execute(resultado)
          assert codigo == 0, f"el programa terminó con {codigo}:\n{salida.getvalue()}"
          assert os.environ["SALIDA_ESPERADA"] in salida.getvalue(), salida.getvalue()
          print("compilador completo (frontend, HIR e intérprete) sin dependencias: ok")
          PY

      - name: Lo que sí exige una dependencia lo dice, en vez de reventar
        run: |
          # '--init-config' escribe el yaml y necesita pyyaml: sin él tiene que
          # salir con un error CLARO (código 3, dependencia faltante), no con
          # un traceback.
          set +e
          salida=$(python V0/main.py --init-config 2>&1)
          codigo=$?
          set -e
          echo "$salida"
          test $codigo -eq 3 || { echo "se esperaba exit 3 (dependencia), salió $codigo"; exit 1; }
          if echo "$salida" | grep -qi "traceback"; then
            echo "reventó en vez de diagnosticar"
            exit 1
          fi
          echo "$salida" | grep -q "pyyaml" || { echo "el mensaje no nombra la dependencia"; exit 1; }
          echo "diagnóstico de dependencia correcto"

  version-minima:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # La documentación promete 3.10+; se comprueban el mínimo y el actual.
        # Sin la matriz, "3.10+" es una afirmación que nadie verifica.
        python: ["3.10", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Escribir el programa
        run: printf '%s' "$PROGRAMA" > ci_programa.srcx

      - name: El programa compila y corre
        run: |
          salida=$(python V0/main.py ci_programa.srcx --run)
          echo "$salida"
          echo "$salida" | grep -qF "$SALIDA_ESPERADA" || {
            echo "el programa no imprimió '$SALIDA_ESPERADA'"; exit 1; }

      - name: Huella del .phir
        id: huella
        run: |
          # Ruta EXPLICITA: buscar el .phir con 'find' dependia de donde lo
          # dejara la configuracion, y una segunda copia vieja habria dado una
          # huella equivocada sin que nada avisara.
          mkdir -p huella
          python V0/main.py ci_programa.srcx --emit-hir huella/ci_programa.srcx.phir >/dev/null
          test -f huella/ci_programa.srcx.phir || { echo "no se emitio el .phir"; exit 1; }
          sha=$(sha256sum huella/ci_programa.srcx.phir | cut -d" " -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "huella en Python ${{ matrix.python }}: $sha"

      - name: Guardar la huella
        uses: actions/upload-artifact@v7
        with:
          name: huella-py${{ matrix.python }}
          path: huella/ci_programa.srcx.phir
          if-no-files-found: error

  reproducible:
    name: El .phir es idéntico entre versiones de Python
    needs: version-minima
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperar las huellas
        uses: actions/download-artifact@v4
        with:
          path: huellas

      # Localmente se comprueba que dos corridas dan los mismos bytes. La
      # promesa de verdad es más fuerte: el MISMO programa da el MISMO
      # artefacto en cualquier máquina. Eso es lo que sostiene una caché de
      # build por hash y los golden compartidos entre backends.
      - name: Comparar
        run: |
          mapfile -t archivos < <(find huellas -name "ci_programa.srcx.phir" | sort)
          test "${#archivos[@]}" -ge 2 || { echo "hacen falta 2 huellas"; exit 1; }
          primera=$(sha256sum "${archivos[0]}" | cut -d' ' -f1)
          for a in "${archivos[@]}"; do
            actual=$(sha256sum "$a" | cut -d' ' -f1)
            echo "  $actual  $a"
            test "$actual" = "$primera" || {
              echo "el .phir NO es reproducible entre versiones de Python"; exit 1; }
          done
          echo "mismo programa, mismos bytes: $primera"

  contrato-del-lsp:
    name: La especificación publicada es válida
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # '--emit-lang-info' es el contrato con la extensión y el LSP: keywords,
      # símbolos, hooks, códigos de error. Si deja de ser JSON válido o pierde
      # una clave, se rompe una herramienta que vive fuera de este repo y
      # ninguna prueba de aquí lo notaría.
      - name: El JSON del lenguaje es válido y completo
        run: |
          python V0/main.py --emit-lang-info > lang.json
          python - <<'PY'
          import json
          import sys
          d = json.load(open("lang.json", encoding="utf-8"))
          faltan = [k for k in ("lang_info_version", "compiler_version",
                                "keywords", "symbols",
                                "hooks", "tokens", "errors", "directives",
                                "severities", "stages", "syntax",
                                "snippets") if k not in d]
          assert not faltan, f"la especificación perdió claves: {faltan}"
          assert d["keywords"] and d["symbols"] and d["errors"], \
              "la especificación viene vacía"

          # La versión que publica el contrato tiene que ser la de version.py,
          # no una copia que alguien escribió aparte.
          sys.path.insert(0, ".")
          from version import VERSION
          assert d["compiler_version"] == VERSION, (
              f"lang-info dice {d['compiler_version']} y version.py dice {VERSION}")

          print(f"lang_info v{d['lang_info_version']} de suriaX {VERSION}: "
                f"{len(d['keywords'])} keywords, {len(d['symbols'])} símbolos, "
                f"{len(d['errors'])} códigos de error")
          PY

      # '--emit-index' es el canal de hover / ir a la definición / completar:
      # un archivo con una función tiene que dar su símbolo, con firma.
      - name: El índice del LSP responde
        run: |
          printf 'fn doble(int n) -> int { return n * 2; }\nfn main() -> int { return doble(2); }\n' \
            | python V0/main.py probe.srcx --emit-index --stdin > index.json
          python - <<'PY'
          import json
          d = json.load(open("index.json", encoding="utf-8"))
          assert d["diagnostics"] == [], d["diagnostics"]
          doble = [s for s in d["symbols"] if s["name"] == "doble"]
          assert doble and doble[0]["detail"] == "fn doble(int n) -> int", d["symbols"]
          print(f"index v{d['index_version']}: {len(d['symbols'])} símbolos, "
                f"{len(d['references'])} referencias")
          PY
