<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="viz" viewBox="0 0 820 804" width="820" height="804" role="img" aria-labelledby="t d">
<title id="t">Metodología: tres fases</title>
<desc id="d">Fase 1, diseño: esquema versionado del HIR, del esquema 1 con los tipos en línea al esquema 2 con pool de tipos. Fase 2, implementación: el compilador en Python emite el .phir y lo leen el intérprete en Python, la VM en C++ y el target web en TypeScript a WebAssembly. Fase 3, evaluación: 11 programas por 3 targets por 2 esquemas, 30 corridas con la primera descartada y la mediana; se mide equivalencia, tamaño y tiempo contra el intérprete con el esquema 2, y cada celda es OK, No soportado o Error.</desc>
<style>
.viz { --surface:#ffffff; --ink:#0b0b0b; --ink-2:#52514e; --borde:#c9c8c1;
       --cabecera:#eef3fb; --acento:#2a78d6;
       --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; }
.fondo { fill: var(--surface); }
text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
.caja { fill: var(--surface); stroke: var(--borde); stroke-width: 1.5; }
.cab { fill: var(--cabecera); }
.fase { font-size: 25px; font-weight: 700; }
.obj { font-size: 21px; font-weight: 600; fill: var(--acento); }
.linea { font-size: 22px; }
.fuerte { font-size: 22px; font-weight: 700; }
.flecha { stroke: var(--ink-2); stroke-width: 2.5; fill: none; }
.punta { fill: var(--ink-2); }
.ok { fill: var(--good); } .ns { fill: var(--warn); } .err { fill: var(--crit); }
</style>
<rect class="fondo" x="0" y="0" width="820" height="804"/>
<rect class="caja" x="30" y="20" width="760" height="206" rx="10"/>
<path class="cab" d="M31,68 L31,30 Q31,21 40,21 L780,21 Q789,21 789,30 L789,68 Z"/>
<text class="fase" x="48" y="52">FASE 1 · Diseño</text>
<text class="obj" x="772" y="52" text-anchor="end">Objetivo 1</text>
<text class="fuerte" x="48" y="104">Esquema versionado del HIR (protobuf)</text>
<text class="linea" x="48" y="137">Esquema 1: cada tipo se escribe dentro de su nodo</text>
<text class="linea" x="48" y="170">Esquema 2: cada tipo se guarda una vez y los nodos</text>
<text class="linea" x="48" y="203">lo referencian (pool de tipos)</text>
<line class="flecha" x1="410.0" x2="410.0" y1="230" y2="252"/>
<path class="punta" d="M401.0,250 L419.0,250 L410.0,264 Z"/>
<rect class="caja" x="30" y="266" width="760" height="173" rx="10"/>
<path class="cab" d="M31,314 L31,276 Q31,267 40,267 L780,267 Q789,267 789,276 L789,314 Z"/>
<text class="fase" x="48" y="298">FASE 2 · Implementación</text>
<text class="obj" x="772" y="298" text-anchor="end">Objetivo 2</text>
<text class="fuerte" x="48" y="350">El compilador (Python) emite el .phir en el esquema 1 o 2</text>
<text class="linea" x="48" y="383">Lo leen el intérprete (Python), la VM (C++)</text>
<text class="linea" x="48" y="416">y el web (TS → WASM), con los dos esquemas</text>
<line class="flecha" x1="410.0" x2="410.0" y1="443" y2="465"/>
<path class="punta" d="M401.0,463 L419.0,463 L410.0,477 Z"/>
<rect class="caja" x="30" y="479" width="760" height="305" rx="10"/>
<path class="cab" d="M31,527 L31,489 Q31,480 40,480 L780,480 Q789,480 789,489 L789,527 Z"/>
<text class="fase" x="48" y="511">FASE 3 · Evaluación</text>
<text class="obj" x="772" y="511" text-anchor="end">Objetivo 3</text>
<text class="fuerte" x="48" y="563">11 programas × 3 targets × 2 esquemas</text>
<text class="linea" x="48" y="596">30 corridas, la primera descartada; mediana</text>
<text class="linea" x="48" y="629">Se mide: equivalencia · tamaño · tiempo</text>
<text class="linea" x="48" y="662">Referencia: intérprete con esquema 2. Cada celda es:</text>
<rect class="ok" x="48" y="678" width="19" height="19" rx="3"/>
<text class="linea" x="77" y="695"><tspan font-weight="700">OK</tspan>: misma salida y código de salida</text>
<rect class="ns" x="48" y="711" width="19" height="19" rx="3"/>
<text class="linea" x="77" y="728"><tspan font-weight="700">No soportado</tspan>: el target lo rechaza</text>
<rect class="err" x="48" y="744" width="19" height="19" rx="3"/>
<text class="linea" x="77" y="761"><tspan font-weight="700">Error</tspan>: el programa diverge</text>
</svg>
