// =========================================================================
// hir.proto — esquema del HIR de suriaX (v2, Fase 5)
//
// El HIR es la frontera entre el frontend Python y sus DOS consumidores:
// el backend C++ (MIR -> LLVM IR) y el intérprete tree-walk (ver
// runtime/interpreter/ARQUITECTURA.md). Serializa DOS cosas:
//
//   1. el AST-tipado VALIDADO (la salida de la fase Semántica, con el
//      'restype' de cada expresión anotado en sitio), y
//   2. la SymbolTable persistente (símbolos globales + hooks de tipo),
//
// exactamente las dos salidas que 'semantic.analyze()' produce hoy.
//
// QUE CAMBIO EN v2 (schema_version == 2). Un POOL de tipos en el Module y
// nodos que lo referencian por indice ('Expr.type_id' y hermanos) en vez de
// re-serializar el mismo 'Type' una y otra vez. Fue el UNICO cambio entre el
// esquema 1 y el 2, y esta medido, no supuesto: ver docs/plan_hir_v2.md.
//
// VERSIONADO Y ROLLBACK AL ESQUEMA 1. Al pasar al 2 los campos inline del 1
// quedaron 'reserved' y los lectores rechazaban un .phir v1. Hoy esos campos
// VUELVEN, en sus TAGS ORIGINALES y con el MISMO significado (reutilizar un
// tag reservado con su significado original es seguro: ningun lector lo leyo
// nunca como otra cosa). Asi el esquema 1 sigue funcionando:
//
//   - el emisor lo escribe con 'python V0/main.py prog.srcx --emit-hir
//     --hir-schema 1': schema_version = 1, SIN 'Module.types' y con cada tipo
//     INLINE (por defecto sigue siendo el 2);
//   - los tres lectores (interprete, VM y web) aceptan {1, 2}. Un v1 se
//     NORMALIZA al cargarlo: se construye el pool desde los tipos inline y se
//     rellenan los 'type_id'; desde ahi el camino es el mismo que con el 2.
//     Cualquier otra version se sigue rechazando (fail-fast).
//
// Campos del esquema 1 RECUPERADOS (tag original): Expr.restype = 3,
// VarDecl.type = 2, Parameter.type = 1, FunctionDecl.return_type = 3,
// Field.type = 1. Campos de tipo NACIDOS DESPUES del esquema 1, con su gemelo
// inline en un tag NUEVO para que el esquema 1 "adaptado a hoy" exprese todo
// el lenguaje sin pool: LambdaExpr.return_type = 5, EnumItem.payload_types =
// 4. ('SizeofExpr.type', 'CastExpr.type', 'CatchClause.type' y la
// SymbolTable siempre fueron inline: no cambian.)
//
// En un .phir v2 los campos inline NO se escriben ni se leen; en uno v1 los
// 'type_id' y el pool NO se escriben, y un lector que los encuentre lo
// rechaza (un v1 con pool es un archivo mal formado, no "casi un v2"). El
// esquema 1 tal como era en el commit 8b8e65e esta copiado, como referencia
// historica, en dev/diff/schema/hir_v1_original.proto.
//
// ALCANCE, que no cambió entre v1 y v2:
//  - SIN REGIONES: 'region'/'shrd', 'make T in r' y 'x at r' nunca viajaron
//    y se RETIRARON del lenguaje en v0.2.0 (ver
//    documentation/source/memory_decision.rst). Sus tags quedan 'reserved':
//    nada de lo que un lector conoce cambió de significado, y reintroducirlas
//    algún día no rompería el esquema.
//  - move-semantics SÍ viaja: 'MoveStmt' y 'Symbol.moved_at' — el
//    intérprete hace cumplir use-after-move EN RUNTIME (los caminos que el
//    análisis estático conservador no ve), igual que hará el MIR.
//  - 'alloc' dejó de existir en el lenguaje (la reserva cruda la aporta
//    una librería): su tag también queda 'reserved'.
//  - Reglas de punteros SÍ viajan, en dos lugares:
//      * en el TIPO: 'Type.mut' distingue 'ptr mutable T' (escritura a
//        través del puntero) de 'ptr T' (solo lectura) — participa de la
//        identidad del tipo, igual que en include/types_ast.py;
//      * en el NODO: '&x' es un mensaje propio (AddrOf) con la mutabilidad
//        YA RESUELTA por la Semántica (binding 'var' -> mut, 'const' ->
//        no-mut). Los consumidores despachan por caso, nunca comparando
//        strings de operadores.
//
// Decisiones de diseño (justificación completa en PROTOBUF_BRIDGE.md):
//  - un solo 'oneof' por categoría (Expr/Stmt/Decl) en vez de 'Any':
//    despacho O(1) por 'case' en C++, sin reflexión ni registry.
//  - 'Type' plano con kind + inner recursivo: espejo 1:1 de
//    include/types_ast.py (TypeKind/Type).
//  - los hooks viajan como referencias por nombre (owner + kind), no como
//    punteros a nodos: el lector los re-enlaza contra su propia tabla en
//    O(1). Cero dependencia del layout de memoria de Python.
//  - 'schema_version' explícito: el lector RECHAZA versiones que no conoce
//    en vez de mal-interpretarlas (fail-fast).
//
// HOOKS DE USUARIO (HTIMS, htims/). El vocabulario de hooks dejó de ser un
// conjunto cerrado del compilador: un proyecto puede DECLARAR los suyos
// ('extends.srcx' + calls_dir). Un enum no puede representar un nombre que
// nadie conoce en tiempo de compilación del esquema, así que:
//
//   - 'HookKind.EXTENDED' marca "el nombre manda", y 'hook_name' lo lleva;
//   - la clave de despacho pasa de (owner, kind) a (owner, kind, name), con
//     name == "" en TODO hook del vocabulario fijo.
//
// Y nada más: el HIR gana la IDENTIDAD del hook (sin ella no hay despacho
// posible) y no el estado del proyecto que lo declara. El nombre del
// proyecto, el manifiesto y la lista de extensiones son configuración, no
// IR — mantenerlos fuera es lo que evita que el '.phir' derive de artefacto
// ejecutable a archivo de estado.
//
// Es un cambio ADITIVO -- campos nuevos, ningún tag reasignado -- así que
// 'schema_version' sigue en 1: un '.phir' emitido antes se lee igual (los
// campos ausentes valen "" / 0) y un lector viejo salta lo que no conoce en
// vez de malinterpretarlo. Por eso el backend web no necesita saber nada de
// esto: su decodificador ya descarta los tags desconocidos.
// =========================================================================

syntax = "proto3";

package suriax.hir.v0;

// ---------------------------------------------------------------------- //
// raíz
// ---------------------------------------------------------------------- //

message Module {
  // versión del ESQUEMA (no del compilador). Se incrementa ante cualquier
  // cambio incompatible; el lector valida antes de tocar nada más.
  uint32 schema_version = 1;   // 2 por defecto (SCHEMA_VERSION en emmit_IR.py);
                               // 1 con '--hir-schema 1' (tipos inline, sin pool)
  string source_file = 2;      // ruta del .srcx de origen (diagnósticos)

  SymbolTable symbols = 3;
  repeated Decl items = 4;     // Program.items validado, en orden

  // unidades .libsrx importadas: cada una compila a SU PROPIO .phir (los
  // exports NO se re-embeben aquí — Symbol IMPORT viaja opaco). El
  // consumidor (module linker del intérprete / lector C++) resuelve 'phir'
  // RELATIVO al directorio de este archivo y liga las unidades.
  repeated LibraryRef libraries = 5;

  // POOL DE TIPOS (v2). Un programa mediano emite decenas de miles de 'Type'
  // sobre unas pocas decenas DISTINTAS (medido en dev/bench_hir.py: 21 065
  // mensajes de 43 tipos distintos, 490x de repeticion, el 20% del
  // artefacto). Aqui viaja cada tipo UNA vez y los nodos lo referencian por
  // indice.
  //
  // El indice 0 es el tipo VACIO: 'type_id = 0' significa "sin tipo
  // anotado", que es exactamente el default de proto3 -- asi la ausencia no
  // necesita un campo de presencia y un nodo sin tipo no ocupa ningun byte.
  //
  // La SymbolTable NO participa: sus 'Type' son inline. Es el 4% de los
  // bytes y la parte que una persona lee al depurar; plegarla habria
  // costado legibilidad sin ganancia medible.
  //
  // Solo en el esquema 2. Un .phir v1 no lo lleva: sus tipos van inline.
  repeated Type types = 6;

  // NOTA de alcance (HTIMS): el nombre del proyecto y la lista de
  // extensiones NO viajan aquí. Describen el PROYECTO, no esta unidad, y no
  // hacen falta ni para ejecutar ni para bajar a MIR; viven en la
  // configuración cargada y se consultan con '--emit-extensions'. Lo único
  // que el HIR necesita de un hook de usuario es su IDENTIDAD ('hook_name'),
  // sin la cual el despacho es imposible.
}

message LibraryRef {
  string alias = 1;  // nombre público ('IO'): el mismo del '#export'
  string phir = 2;   // archivo de la unidad ('IO.phir'), relativo a este .phir
}

// ---------------------------------------------------------------------- //
// tipos resueltos — espejo de include/types_ast.py
// ---------------------------------------------------------------------- //

enum TypeKind {
  TYPE_UNSPECIFIED = 0;  // proto3 exige un 0; equivale a "sin tipo" (null)
  VOID = 1;
  BOOL = 2;
  INT = 3;
  FLOAT = 4;
  CHAR = 5;
  STR = 6;
  POINTER = 7;   // 'inner' = tipo apuntado; 'mut' = escribible a través de él
  NULLABLE = 8;  // 'inner' = tipo envuelto
  NOMINAL = 9;   // 'name'  = struct/enum/type por nombre (tipado nominal)
  META = 10;     // 'type': el tipo de un TIPO ('const type int8;')
  ERROR = 11;    // 'error T' (inner) o 'error' solo: union valor-o-error
  BYTE = 12;     // entero SIN signo de 8 bits (0..255). Un bloque de 'byte'
                 // es compacto en la VM: un byte por celda
  // TIPO FUNCION ('fn(int, str) -> bool'): el de una funcion con nombre
  // usada como VALOR. Reusa los campos que ya tiene 'Type', sin añadir
  // ninguno: 'args' son los tipos de los PARAMETROS en orden (puede no haber
  // ninguno) e 'inner' el del RETORNO (siempre presente; VOID si no devuelve
  // nada). Es el mismo convenio que include/types_ast.py.
  //
  // Donde aparece: en el pool, como tipo de una variable/parametro/campo, y
  // como 'type_id' de la expresion que produce el valor:
  //   - 'Identifier' con el nombre de una funcion de la unidad;
  //   - 'MemberAccess' sobre un modulo ('lib.f'): el obj es el Namespace;
  //   - 'MemberAccess' sobre un TIPO ('Punto.distancia'): un metodo de
  //     '@impl'. Su 'obj' lleva el tipo META (no es un valor que evaluar) y
  //     el dueño del metodo es el nucleo nominal de args[0] (el receptor).
  // Una llamada a traves de un valor es un 'Call' corriente: su 'callee' es
  // cualquier Expr cuyo tipo es FUNCTION_TYPE (o NULLABLE de FUNCTION_TYPE) y su 'hook'
  // va vacio. Sin capturas: el valor es la funcion y nada mas.
  //
  // Cambio ADITIVO (schema_version sigue en 2): un .phir sin funciones como
  // valores no cambia ni un byte. Un lector que no conoce el 13 lo ve como
  // un kind desconocido; el contrato (A-3) es RECHAZARLO con su codigo, nunca
  // ejecutar otra cosa.
  //
  // Se llama FUNCTION_TYPE y no FUNCTION porque los valores de un enum de
  // protobuf son hermanos de su tipo (ambito del paquete, como en C++):
  // 'SymbolKind.FUNCTION' ya usa el nombre, y repetirlo hace que protoc
  // rechace el archivo y que el modelo C++ generado no compile. El emisor
  // traduce el 'TypeKind.FUNCTION' de include/types_ast.py a este nombre.
  FUNCTION_TYPE = 13;
}

message Type {
  TypeKind kind = 1;
  string name = 2;   // solo NOMINAL
  Type inner = 3;    // POINTER / NULLABLE / ERROR ('error' solo -> inner ausente)
                     // FUNCTION_TYPE: el tipo de RETORNO
  // REGLA DE PUNTEROS (const-correctness): 'ptr mutable T' permite escribir
  // a través del puntero; 'ptr T' es solo lectura. Participa de la igualdad
  // del tipo; la única coerción segura es SOLTAR mutabilidad
  // (ptr mutable T -> ptr T), nunca ganarla. Espejo de types_ast.Type.mut.
  bool mut = 4;      // solo POINTER
  // ARGUMENTOS DE TIPO de un generico ('Vector<int>'), solo NOMINAL.
  // Participan de la identidad del tipo: 'Vector<int>' y 'Vector<str>' son
  // tipos distintos, y el consumidor no los puede confundir. Espejo de
  // types_ast.Type.args.
  // FUNCTION_TYPE: los tipos de los PARAMETROS, en orden.
  repeated Type args = 5;
}

// ---------------------------------------------------------------------- //
// tabla de símbolos persistente — espejo de semantic/symbol_table.py
// ---------------------------------------------------------------------- //

enum SymbolKind {
  SYMBOL_UNSPECIFIED = 0;
  FUNCTION = 1;
  STRUCT = 2;
  ENUM = 3;
  ENUM_ITEM = 4;
  PARAM = 5;
  VAR = 6;
  FIELD = 7;
  IMPORT = 8;
  HOOK = 10;
  TYPE = 11;    // tipo nominal OPACO declarado con 'type' (ast_nodes.TypeDecl)

  reserved 9;   // REGION: retirado con el modelo por regiones (v0.2.0)
  reserved "REGION";
}

enum HookKind {
  HOOK_UNSPECIFIED = 0;
  FREE = 1;    // __free__:   fn __free__(T ptr x) -> void
  reserved 2;  // MAKE: '__make__' existía solo para 'make T in r'; retirado en
  reserved "MAKE";  // v0.2.0 con el modelo por regiones (nunca tuvo disparador)
  SIZEOF = 3;  // __sizeof__: fn __sizeof__(T ptr x) -> int
  PRINT = 4;   // __print__:  fn __print__(T ptr x) -> void
  LEN = 5;     // __len__:    fn __len__(T ptr x) -> int
  CAST = 6;    // __cast__:   fn __cast__(X x) -> T — dueño: el lado NOMINAL
               // de la firma; se dispara con 'cast<T>(x)'
  INDEX = 7;   // __index__:  fn __index__(T ptr x, int i) -> Elem — se dispara
               // con 'v[i]' sobre un tipo nominal (dueño: primer parámetro)
  INDEX_SET = 8; // __index_set__: fn __index_set__(T ptr mutable x, int i, Elem v)
               // -> void — se dispara con 'v[i] = x' (dueño: primer parámetro)
  EQ = 9;      // __eq__: fn __eq__(T ptr a, T ptr b) -> bool — se dispara con
               // 'a == b' entre nominales (dueño: primer parámetro)
  MIN = 10;    // __min__: fn __min__(T ptr x) -> int — cota INFERIOR del tipo
  MAX = 11;    // __max__: fn __max__(T ptr x) -> int — cota SUPERIOR. Los dos
               // los lee el COMPILADOR (el literal de su 'return') para decidir
               // si un literal cabe en un tipo numérico de librería; viajan al
               // HIR como cualquier otro hook, no los dispara ninguna sintaxis
  HASH = 12;   // __hash__: fn __hash__(T ptr x) -> int — se dispara con
               // 'hash(x)'. Sobre int/bool/char/str es NATIVO (dueño: el
               // primitivo) y sobre un parametro de tipo lo decide el backend
               // con el tipo concreto
  CMP = 13;    // __cmp__: fn __cmp__(T ptr a, T ptr b) -> int — se dispara con
               // 'a < b', '<=', '>', '>=' entre nominales (dueño: primer
               // parámetro). Negativo: 'a' va antes; 0: empatan; positivo: va
               // después. Como EQ, ninguna expresión lo nombra: el backend lo
               // busca por el tipo CONCRETO del operando. Valor nuevo y
               // aditivo: un lector viejo no lo encuentra en ninguna expresión

  // hook DECLARADO POR EL USUARIO (HTIMS). No tiene número propio porque su
  // identidad es el NOMBRE ('hook_name'), no un valor del enum: el
  // compilador no puede enumerar lo que aún no existe. El hueco hasta 100
  // queda libre para futuros hooks del vocabulario fijo.
  EXTENDED = 100;
}

message Symbol {
  string name = 1;
  SymbolKind kind = 2;
  uint32 ln = 3;
  uint32 col = 4;
  Type type = 5;              // retorno para FUNCTION/HOOK; tipo del binding si VAR/...
  bool mutable = 6;
  uint32 moved_at = 8;                        // línea del 'move' estático (0 = nunca)
  repeated Type param_types = 9;              // FUNCTION/HOOK
  // STRUCT: campos | ENUM: items. Un IMPORT viaja OPACO (sin members): sus
  // exports viven en el .phir de su propia unidad (Module.libraries).
  map<string, Symbol> members = 10;
  HookKind hook_kind = 11;                    // solo kind == HOOK
  string hook_owner = 12;                     // idem
  // nombre del hook cuando 'hook_kind == EXTENDED' ("__gravity__"); "" en
  // todo hook del vocabulario fijo, cuyo nombre ya lo dice el enum.
  string hook_name = 14;

  reserved 7, 13;  // region / shared: del modelo por regiones, retirado
  reserved "region", "shared";
}

message HookEntry {
  string owner_type = 1;  // nombre nominal dueño ("Punto")
  HookKind kind = 2;
  Symbol symbol = 3;
  // "" salvo con kind == EXTENDED: junto a (owner_type, kind) forma la clave
  // de despacho completa.
  string hook_name = 4;
  // extensión que lo declaró ("physics"); solo procedencia, para que un
  // diagnóstico pueda decir de dónde salió el vocabulario.
  string extension = 5;
}

message SymbolTable {
  // scope GLOBAL completo; los scopes de bloque no sobreviven a la fase
  // Semántica (cada lector reconstruye los suyos al recorrer los cuerpos).
  map<string, Symbol> types = 1;   // namespace de TIPOS (struct/enum/type)
  map<string, Symbol> values = 2;  // namespace de VALORES (fn/var/import/enum items)
  repeated HookEntry hooks = 3;    // clave compuesta (owner,kind): no cabe en un map

  // TABLA DE CONVERSIONES (__cast__): un tipo puede declarar VARIAS
  // (int->int8, int8->int, str->Estado...). La clave del par es DERIVABLE
  // de la firma del Symbol: origen = param_types[0], destino = type — el
  // lector reconstruye su índice {(origen,destino): hook} en O(n).
  repeated Symbol casts = 4;
}

// ---------------------------------------------------------------------- //
// referencia a hook enlazado (anotación .hook de la Semántica)
// ---------------------------------------------------------------------- //

message HookRef {
  string owner_type = 1;
  HookKind kind = 2;
  // "" salvo con kind == EXTENDED. La terna (owner_type, kind, hook_name) es
  // la clave EXACTA con la que el lector indexó 'SymbolTable.hooks'.
  string hook_name = 3;
  // suficiente para lookup O(1) en SymbolTable.hooks; NO se re-serializa
  // el Symbol completo (evita duplicarlo N veces).
}

// ---------------------------------------------------------------------- //
// expresiones — espejo de include/ast_nodes.py (Expression)
// ---------------------------------------------------------------------- //

message Expr {
  uint32 ln = 1;
  uint32 col = 2;
  // tipo resuelto por AST-tipado/Semántica, como INDICE en 'Module.types'
  // (v2). 0 = sin tipo anotado: aún no inferible en esta versión del
  // frontend; los targets lo tratan como desconocido, nunca lo adivinan.
  //
  // Es el campo que justifica el pool él solo: hay uno por expresión y son
  // el 93% de los 'Type' del artefacto. Ningún consumidor lo leía inline
  // (el intérprete no lo usa; el web lo resuelve al decodificar), así que
  // plegarlo no movió trabajo a nadie.
  uint32 type_id = 4;

  // ESQUEMA 1: el mismo tipo, INLINE. Tag y significado originales (era
  // 'reserved' en el 2 y volvio para el rollback, ver la cabecera). Ausente
  // = sin tipo anotado, como 'type_id = 0'. Excluyente con 'type_id': cada
  // .phir usa uno de los dos segun su 'schema_version'.
  Type restype = 3;

  oneof node {
    Literal literal = 10;
    InterpolatedString interp = 11;
    Identifier identifier = 12;
    UnaryOp unary = 13;
    BinaryOp binary = 14;
    Assignment assignment = 15;
    Call call = 17;
    Index index = 18;
    MemberAccess member = 19;
    SizeofExpr sizeof = 22;
    AddrOf addr_of = 23;
    CastExpr cast_expr = 24;
    StructLiteral struct_literal = 25;
    MoveExpr move_expr = 26;
    LambdaExpr lambda_expr = 27;
  }

  reserved 16, 20, 21;  // Placement ('x at r') / MakeExpr / AllocExpr
  reserved "placement", "make", "alloc";
}

message Literal {
  string kind = 1;  // 'int' | 'float' | 'str' | 'char' | 'bool' | 'null'
  oneof value {
    int64 int_value = 2;
    double float_value = 3;
    string str_value = 4;   // también char (1 code point)
    bool bool_value = 5;
    // 'null': ningún campo del oneof presente
  }
}

message InterpolatedString {
  // f"texto{expr}texto": segmentos en orden; texto y expresión alternan
  message Part {
    oneof part {
      string text = 1;
      Expr expr = 2;
    }
    // solo con 'expr': '{x!r}' pide la REPRESENTACION y '{x:08b}' un formato
    // '[0][ancho][.precision][tipo]' (tipo: d x X b o | f), ya validado
    // contra el tipo por la Semantica
    bool repr = 3;
    string spec = 4;
  }
  repeated Part parts = 1;
}

message Identifier { string name = 1; }
message UnaryOp    { string op = 1; Expr operand = 2; }  // op: 'not' | '-'
message BinaryOp   { string op = 1; Expr left = 2; Expr right = 3; }
message Assignment {
  Expr target = 1;
  Expr value = 2;
  // el destino POSEE recursos (o es un 'T' de un generico): el valor que
  // tenia muere al recibir el nuevo, destruido por su tipo concreto (ver
  // 'Drop.by_type'). Sin esto 'a = R{...}' perdia el destructor del viejo.
  // El nuevo se evalua ANTES: 'a = f(a)' todavia puede leer el viejo.
  bool drops_old = 3;
}

// '&expr' — dirección de un lvalue. Nodo propio (no un UnaryOp con string):
// los consumidores despachan por caso y la REGLA de mutabilidad ya viene
// resuelta por la Semántica: 'mut' == true si el binding es 'var' (el
// puntero resultante es 'ptr mutable T'), false si es 'const' ('ptr T').
// El Expr.restype contenedor lleva ese mismo tipo puntero completo.
message AddrOf { Expr operand = 1; bool mut = 2; }

message Call {
  Expr callee = 1;
  repeated Expr args = 2;
  HookRef hook = 3;  // __print__/__len__ enlazado por la Semántica, si aplica
  // TEMPORAL: si esta expresion produce un valor que POSEE recursos y nadie
  // se queda con el (no lo recibe un binding, una asignacion ni un 'return'),
  // aqui viaja el '__free__' que lo destruye al terminar la sentencia. Vacio
  // en el caso normal. Quien decide es el frontend: saber si un tipo posee es
  // una pregunta sobre el TIPO.
  HookRef temp_drop = 4;
  // TEMPORAL que se destruye POR SU TIPO (ver 'Drop.by_type'): posee solo por
  // sus campos o su payload (no declara '__free__'), o es un 'T' de un
  // generico. Excluyente con 'temp_drop'.
  bool temp_by_type = 5;
}

// 'move x' en posicion de EXPRESION: transfiere la propiedad Y entrega el
// valor ('var Buffer b = move origen;', 'consumir(move b)'). Sin ella no
// habia forma de ligar a otro nombre un valor que POSEE recursos: ligarlo a
// secas deja dos duenos y su destructor corre dos veces.
//
// 'MoveStmt' sigue siendo la forma de SENTENCIA ('move x;'), que invalida sin
// llevarse el valor a ningun sitio. Son dos nodos porque son dos cosas: una
// produce un valor y la otra no.
message MoveExpr { Expr operand = 1; }

// 'lambda (int ptr x) -> bool: x[0] > umbral': una funcion SIN nombre, con
// sus tipos escritos, que solo existe como ARGUMENTO de una llamada en un
// parametro de tipo funcion (la Semantica lo garantiza: SEM050/SEM051). Su
// tipo (Expr.type_id) es el 'fn(A) -> R' que se comprobo contra ese
// parametro.
//
// Lo que la hace distinta de una funcion con nombre es que LEE el entorno:
// los locales y parametros de quien la escribe (las CAPTURAS), por
// prestamo y solo para leer. Eso es seguro sin analizar vidas porque no
// escapa: muere antes de que termine la llamada que la recibe. Un consumidor
// la ejecuta como un cuerpo que ve el marco donde se evaluo la expresion; el
// interprete lo hace asi. La VM la RECHAZA al bajar a MIR (VM004) y el
// target web en la contencion (WEB104), nunca otra cosa.
//
// - 'params', 'return_type_id': la firma escrita (como en FunctionDecl).
// - 'body': siempre un bloque. La forma corta (': e') llega ya como
//   '{ return e; }' (o '{ e; }' con retorno void); sus drops son los de un
//   cuerpo de funcion (sus parametros que posee y sus locales).
// - 'captures': los nombres del entorno que lee, en orden de primer uso. Es
//   informativo (el marco ya los tiene): lo implicito tiene que verse.
//
// Se llama 'LambdaExpr' y no 'Lambda' para que ningun lector tenga que
// esquivar la palabra reservada 'lambda' de Python.
message LambdaExpr {
  repeated Parameter params = 1;
  uint32 return_type_id = 2;   // indice en 'Module.types' (esquema 2)
  Block body = 3;
  repeated string captures = 4;
  // ESQUEMA 1 "adaptado a hoy": el retorno INLINE. La lambda nacio despues
  // del esquema 1, asi que este gemelo de 'return_type_id' lleva un tag
  // NUEVO (no hay tag original que recuperar).
  Type return_type = 5;
}

message Index        { Expr obj = 1; Expr index = 2; }
message MemberAccess { Expr obj = 1; string member = 2; }
message SizeofExpr   { Type type = 1; HookRef hook = 2; }

// 'cast<T>(x)' — conversión EXPLÍCITA (única vía: el lenguaje no tiene
// coerciones implícitas). 'type' = T escrito; entre primitivos el consumidor
// ejecuta la conversión nativa; con nominal involucrado, 'hook' referencia
// el '__cast__' que la implementa (enlazado por la Semántica).
message CastExpr { Type type = 1; Expr value = 2; HookRef hook = 3; }

// 'T{ campo: expr, ... }' — instancia un struct nominal. 'field_names' y
// 'values' son listas PARALELAS (mismo índice = mismo campo), en orden.
message StructLiteral {
  string type_name = 1;
  repeated string field_names = 2;
  repeated Expr values = 3;
  // TEMPORAL: si esta expresion produce un valor que POSEE recursos y nadie
  // se queda con el (no lo recibe un binding, una asignacion ni un 'return'),
  // aqui viaja el '__free__' que lo destruye al terminar la sentencia. Vacio
  // en el caso normal. Quien decide es el frontend: saber si un tipo posee es
  // una pregunta sobre el TIPO.
  HookRef temp_drop = 4;
  bool temp_by_type = 5;   // como en 'Call'
}

// ---------------------------------------------------------------------- //
// sentencias — espejo de include/ast_nodes.py (Statement)
// ---------------------------------------------------------------------- //

message Stmt {
  uint32 ln = 1;
  uint32 col = 2;

  oneof node {
    Block block = 10;
    VarDecl var_decl = 11;
    IfStmt if_stmt = 13;
    WhileStmt while_stmt = 14;
    MatchStmt match_stmt = 15;
    ReturnStmt return_stmt = 16;
    BreakStmt break_stmt = 17;
    ContinueStmt continue_stmt = 18;
    MoveStmt move_stmt = 19;
    FreeStmt free_stmt = 20;
    ExprStmt expr_stmt = 21;
    ImportBinding import_binding = 22;
    TypeDecl type_decl = 23;
    ThrowStmt throw_stmt = 24;
    TryStmt try_stmt = 25;
    ExpectStmt expect_stmt = 26;
  }

  reserved 12;  // RegionStmt: del modelo por regiones, retirado
  reserved "region";
}

// Destruccion que el compilador INSERTA al cerrar un bloque. Nadie la
// escribe: la decide la Semantica (que sabe que tipos poseen recursos) y
// viaja aqui para que el interprete y el backend nativo ejecuten lo MISMO,
// sin volver a decidirlo cada uno.
//
// La lista es ESTATICA pero el drop no es incondicional: el consumidor
// destruye solo lo que siga vivo. Saber si un valor fue movido o liberado en
// una rama es estado de EJECUCION —la celda ya lo lleva—, no algo que el
// frontend pueda resolver sin un analisis de flujo completo.
message Drop {
  // ruta APLANADA por el frontend: ["b"] es un local, ["c","b"] el campo de un
  // local. Se aplana al compilar porque "que campos poseen recursos" es una
  // pregunta sobre el TIPO, y el consumidor no tiene por que rehacerla.
  repeated string path = 1;
  HookRef hook = 2;   // '__free__' de lo que hay al final de la ruta
  // DESTRUIR POR TIPO ('drop glue'): el frontend no puede aplanar lo que hay
  // al final de la ruta —un 'T' de un generico, el binding de un 'catch (e)'
  // sin tipo, un bloque de 'mem' que es de un campo—, asi que 'hook' va
  // vacio y el consumidor lo destruye por su TIPO CONCRETO: si declara
  // '__free__', ese; si no, sus campos que poseen, en orden inverso; un
  // bloque propio, sus celdas no vacias. Es la misma regla que aplana el
  // frontend, aplicada donde el tipo recien se conoce (el interprete en
  // ejecucion, la VM al monomorfizar).
  bool by_type = 3;
}

message Block {
  repeated Stmt statements = 1;
  // en orden INVERSO al de declaracion: lo ultimo que nace muere primero.
  repeated Drop drops = 2;
}

message VarDecl {
  string qualifier = 1;  // 'const' | 'var' | "" ("" equivale a 'var')
  string name = 3;
  Expr value = 4;        // ausente si no hay inicializador
  uint32 type_id = 5;    // indice en 'Module.types' (v2)
  Type type = 2;         // ESQUEMA 1: inline (tag original, recuperado)
}

// '[qualifier] "type" IDENTIFIER [ "=" expr ];' — tipo nominal OPACO
// (sin representación escrita en suriaX; su layout lo aportan sus hooks).
// El binding es de tipo META ('int8' es un valor de tipo 'type').
message TypeDecl {
  string qualifier = 1;  // 'const' | 'var' | ""
  string name = 2;
  Expr value = 3;        // ausente sin inicializador ('const type int8;')
}

message IfStmt {
  Expr condition = 1;
  Block then_block = 2;
  oneof else_branch {
    Block else_block = 3;
    IfStmt else_if = 4;
  }
}

message WhileStmt { Expr condition = 1; Block body = 2; }

message CaseArm {
  Expr pattern = 1;
  Stmt body = 2;
  // 'case v' en un 'match' sobre un 'T?': el patron NO se compara, LIGA. Es
  // un 'Identifier' (el nombre, con el tipo 'T' en su 'type_id') que solo
  // encaja si el sujeto no es null, y dentro de la rama 'v' es el contenido
  // PRESTADO del sujeto (como el payload que liga 'case E.A(x)').
  //
  // Cambio ADITIVO (schema_version sigue en 2): sin 'case v' el .phir no
  // cambia ni un byte. Un lector que no conoce el campo veria 'case v' como
  // comparar con una variable 'v': el contrato (A-3) es RECHAZARLO de forma
  // explicita, nunca ejecutar esa comparacion (la VM lo hace al bajar el
  // 'match' a MIR; el target web ya rechaza todo sujeto 'T?').
  bool binds = 3;
}
message MatchStmt { Expr subject = 1; repeated CaseArm cases = 2; }

message ReturnStmt {
  Expr value = 1;      // ausente = 'return;'
  // el valor devuelto POSEE recursos: su propiedad pasa al llamador y el
  // ambito que lo tenia no debe destruirlo. Lo decide el frontend.
  bool transfers = 2;
}
message BreakStmt {}
message ContinueStmt {}

// move-semantics: transfiere la propiedad e INVALIDA el origen. La
// Semántica ya reportó los use-after-move lineales (SEM004/SEM005); el
// runtime/MIR hace cumplir los caminos que el análisis estático no ve.
message MoveStmt { Expr target = 1; }

// manejo de errores por EXCEPCIONES:
message ThrowStmt { Expr value = 1; }  // inicia la propagación
// 'expect (condition) [body]': la comprobación de un 'test'. Si no se cumple,
// la prueba TERMINA como fallida: no es una excepción (ningún 'catch' la
// atrapa; los 'finally' que atraviesa sí corren). 'body' ausente = sin bloque.
// 'text' es la condición como se escribió: el mensaje del fallo la cita.
message ExpectStmt {
  Expr condition = 1;
  Block body = 2;
  string text = 3;
}
// Una rama 'catch'. 'type' presente = la rama SOLO atrapa valores de ese
// tipo; ausente = atrapa cualquiera. El consumidor prueba las ramas EN ORDEN
// y se queda con la primera que encaja; si ninguna encaja, el valor sigue
// propagándose.
message CatchClause {
  string name = 1;         // nombre ligado al valor capturado (scope de la rama)
  Block block = 2;
  Type type = 3;           // filtro; ausente = atrapa todo
}

message TryStmt {                      // intercepta la propagación
  Block try_block = 1;
  repeated CatchClause catches = 4;
  // 'finally': corre al salir del try por CUALQUIER camino (su final, un
  // catch, un return/break/continue que lo atraviesa o una excepcion que
  // nadie atrapo, que despues sigue). Ausente = sin 'finally'. Dentro no hay
  // return/break/continue que salgan de el (PAR027); si lanza mientras ya
  // viajaba otra excepcion, el programa termina (RT022).
  Block finally_block = 5;
  // v2 tenía una sola rama sin tipo, inline. Al pasar a N ramas filtradas sus
  // tags quedan 'reserved': un lector viejo NO puede leer un try multi-rama
  // como si fuera de una, que es justo la degradación silenciosa que el
  // esquema evita.
  reserved 2, 3;
  reserved "catch_name", "catch_block";
}

// REGLA DE PUNTEROS: 'free x;' exige que x sea 'ptr T' (SEM014 ya lo
// verificó); si T declara '__free__', el hook viaja enlazado.
message FreeStmt {
  Expr target = 1;
  HookRef hook = 2;
}

message ExprStmt { Expr expr = 1; }

message ImportBinding {
  string qualifier = 1;  // 'const' | 'mutable' | ""
  string name = 2;
  string lib = 3;    // los exports reales ya viajan en SymbolTable (IMPORT.members)
  string member = 4; // solo forma '#from lib #import member': el nombre traído
                     // ("" = import del módulo completo)
}

// ---------------------------------------------------------------------- //
// declaraciones top-level — espejo de include/ast_nodes.py (Declaration)
// ---------------------------------------------------------------------- //

message Decl {
  uint32 ln = 1;
  uint32 col = 2;

  oneof node {
    FunctionDecl function = 10;
    StructDecl struct_decl = 11;
    EnumDecl enum_decl = 12;
    ExternBlock extern_block = 13;
    Stmt statement = 14;      // statements sueltos a nivel de módulo
    ImportDirective import_directive = 15;
    ExportDirective export_directive = 16;
    FromDirective from_directive = 17;
    TestDecl test_decl = 18;
  }
}

// 'test "nombre" { ... }' — bloque de prueba (estilo Zig). El runner lo
// ejecuta; la compilación normal lo transporta pero no lo ejecuta.
message TestDecl {
  string name = 1;
  Block body = 2;
  // cláusulas opcionales (ausente = no escrita). 'errfinally' corre SOLO si
  // la prueba falló; 'finally_block', siempre y después. Cada una es un
  // bloque con su propio ámbito.
  Block errfinally = 3;
  Block finally_block = 4;
}

message Parameter {
  string name = 2;
  uint32 type_id = 3;    // indice en 'Module.types' (v2)
  Type type = 1;         // ESQUEMA 1: inline (tag original, recuperado)
}

message FunctionDecl {
  string name = 1;
  repeated Parameter params = 2;
  uint32 return_type_id = 7;   // indice en 'Module.types' (v2)
  Block body = 4;         // ausente = PROTOTIPO (la implementación la aporta
                          // el backend / #extern)
  string dunder = 5;      // nombre sin guiones si es hook/dunder ("" = normal)
  string decorator = 6;   // "@decorador" aplicado, si lo hay ("" = ninguno)
  // PARAMETROS DE TIPO de un generico ('fn make<T>' -> ["T"]), incluidos los
  // del '@impl Vector<T>' de un metodo, en orden. Dentro de la funcion un
  // parametro aparece como un NOMINAL con ese nombre. Sin esta lista un
  // consumidor no distingue 'T' de un tipo que no conoce, y no puede
  // monomorfizar (el backend C++ baja una copia por tipo concreto).
  repeated string type_params = 8;

  Type return_type = 3;   // ESQUEMA 1: inline (tag original, recuperado)
}

message Field {
  string name = 2;
  uint32 type_id = 3;    // indice en 'Module.types' (v2)
  Type type = 1;         // ESQUEMA 1: inline (tag original, recuperado)
}
message StructDecl {
  string name = 1;
  repeated Field fields = 2;
  // PARAMETROS DE TIPO en ORDEN ('struct {...} Par<A, B>' -> ["A", "B"]): es
  // lo que casa 'Par<int, str>' con sus campos. El orden no se puede deducir
  // de los campos (pueden usar B antes que A).
  repeated string type_params = 3;
}

// Una variante de enum. Dos formas EXCLUYENTES:
//   - variante UNIDAD: 'value' es su entero (explicito o auto-numerado).
//   - variante con PAYLOAD: 'payload' lleva los tipos que transporta, y
//     entonces el enum es un tipo SUMA — sus valores dejan de ser enteros.
// El consumidor distingue por 'payload' vacio o no; sin ese campo no podria
// saber si 'Literal' es un entero o un constructor que hay que invocar.
message EnumItem {
  string name = 1;
  Expr value = 2;
  repeated uint32 payload_type_ids = 3;  // indices en Module.types (esquema 2)
  // ESQUEMA 1 "adaptado a hoy": los mismos tipos INLINE, en el mismo orden.
  // El payload nacio despues del esquema 1: tag NUEVO, no recuperado.
  repeated Type payload_types = 4;
}
message EnumDecl {
  string name = 1;
  repeated EnumItem items = 2;
  // PARAMETROS DE TIPO de un enum GENERICO, en ORDEN ('enum Res<T, E>' ->
  // ["T", "E"]): el payload los nombra ('Ok(T)' es un NOMINAL "T") y una
  // instancia ('Res<int, str>', NOMINAL con 'args') dice con que se
  // sustituyen, igual que 'StructDecl.type_params'. Cambio ADITIVO: un enum
  // que no es generico no cambia ni un byte. Un lector que no lo conoce
  // leeria 'T' como un tipo sin declarar: el contrato (A-3) es RECHAZARLO
  // (la VM lo hace con VM002; el target web ya rechaza todo enum con
  // payload).
  repeated string type_params = 3;
}

message ExternBlock {
  string target = 1;  // hoy solo "cpp"
  string raw = 2;     // el C++ crudo, tal cual lo capturó el lexer
  // banderas que esta unidad necesita para compilar/enlazar su C++
  // ('requires("-lX11")'). Viajan con el bloque porque quien trae el C++ es
  // quien sabe de qué depende: el consumidor de una librería no tiene por
  // qué averiguar sus dependencias nativas. El linker las SUMA a las del
  // proyecto ('toolchain.cxx_flags').
  repeated string requires = 3;
}

// Un import transporta TRES nombres distintos, y ninguno se deriva de otro
// sin re-hacer la resolución del linker de librerías:
//
//   'lib'     lo que se ESCRIBIÓ ('io.stdp'). Solo para diagnósticos.
//   'unit'    la unidad RESUELTA ('IO.stdp'): la clave de 'LibraryRef.alias'
//             y por tanto el .phir que hay que cargar y ejecutar.
//   'binding' el nombre LOCAL bajo el que la Semántica ligó el módulo en el
//             scope ('stdp'). No coincide con el último componente de 'unit'
//             cuando el import difiere en mayúsculas del '#export' que
//             resolvió ('#import io' sobre '#export package as IO' liga
//             'io' y carga la unidad 'IO').
//
// Escribir los tres es la aplicación de D3 (el intérprete EJECUTA lo que la
// Semántica ya decidió, no lo re-decide): cualquier consumidor del HIR
// —intérprete Python o backend C++— liga exactamente los mismos nombres sin
// reimplementar 'linker_p'.
message ImportDirective {
  string lib = 1;      // puede ser punteado: 'io.string' (submodulo de paquete)
  string alias = 2;    // el 'as X' tal cual se escribió ("" si no hay)
  string unit = 3;     // unidad resuelta ('IO.stdp'); "" si no se pudo resolver
  string binding = 4;  // nombre local ligado por la Semántica
}
message ExportDirective {
  string alias = 1;
  bool package = 2;  // '#export package as <alias>': padre de un paquete
}
message FromDirective {
  string lib = 1;
  string name = 2;   // el miembro traído: '#from d_types #import dt_variables'
  string alias = 3;
  string unit = 4;   // unidad resuelta de 'lib' (misma regla que ImportDirective)
}
